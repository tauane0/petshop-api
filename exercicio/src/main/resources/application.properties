spring.application.name=exercicio

# ===================================================================
# CONFIGURAÇÕES DO BANCO DE DADOS (MySQL)
# ===================================================================
# Altere 'localhost:3306/nome_do_banco' para o endereço e nome do seu banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/dev_api?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false

# Credenciais de acesso ao MySQL
spring.datasource.username=root
spring.datasource.password=NK324bk4

# Driver do MySQL (Opcional a partir do Spring Boot 2.x+, pois ele detecta automaticamente)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# ===================================================================
# Estratégia de criação de tabelas (update, create, create-drop, none, validate)
spring.jpa.hibernate.ddl-auto=update

# Exibe as consultas SQL geradas no console (útil para desenvolvimento)
spring.jpa.show-sql=true

# Formata o SQL exibido no console para torná-lo legível
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do MySQL (Geralmente opcional nas versões recentes do Spring Boot)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

